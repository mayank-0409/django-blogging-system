{% extends 'base.html' %}

{% block content %}
    {% load crispy_forms_tags %}
    <div class="d-flex justify-content-center align-items-center p-3 p-md-4" style="min-height:calc(100vh - 2rem);">
        <div class="bg-white shadow-sm p-4 p-md-5 w-100" style="max-width:500px; border-radius:1rem;">
            <h3 class="text-center mb-4">Login</h3>
            <form action="{% url 'login' %}" method="POST">
                {% csrf_token %}
                {{ form|crispy }}
                <button type="submit" class="btn btn-warning w-100">Submit</button>
            </form>
        </div>
    </div>
{% endblock %}
