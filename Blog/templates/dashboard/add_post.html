{% extends 'base.html' %}

{% block content %}
{% load crispy_forms_tags %}
    <div class="row">
        <!-- LOAD THE SIDE BAR -->
        {% include 'dashboard/sidebar.html' %}

        <!-- RIGHT SIDE CONTENT -->
        <div class="col-md-9">
            <h2>Add New Posts</h2>
            
            <form action="" method="POST">
                {% csrf_token %}
                {{ form|crispy }}
                <button type="submit" class="btn btn-warning">Submit</button>
            </form>
            <br>
        </div>
    </div>
{% endblock %}
