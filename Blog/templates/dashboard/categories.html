{% extends 'base.html' %}

{% block content %}
    <div class="row">
        <!-- LOAD THE SIDE BAR -->
        {% include 'dashboard/sidebar.html' %}

        <!-- RIGHT SIDE CONTENT -->
        <div class="col-md-9">
            <h2>All Categories</h2>
            <table class="table">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Cateory Name</th>
                        <th>Created At</th>
                        <th>Updated At</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    {% for cat in categories %}
                        <tr>
                            <th>{{ forloop.counter }}</th>
                            <td>{{ cat }}</td>
                            <td>{{ cat.created_at }}</td>
                            <td>{{ cat.updated_at }}</td>
                            <td>
                                <a href=""><i class="fa fa-edit text-success"></i></a>
                                &nbsp;
                                <a href=""><i class="fa fa-trash text-danger"></i></a>
                            </td>
                        </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
{% endblock %}
