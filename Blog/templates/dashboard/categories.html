{% extends 'base.html' %}

{% block content %}
    <div class="d-flex justify-content-center p-3 p-md-4">
        <div class="d-flex bg-white shadow-sm" style="width:100%; max-width:1400px; min-height:calc(100vh - 2rem); border-radius:1rem; overflow:hidden;">

            <!-- LOAD THE SIDE BAR -->
            {% include 'dashboard/sidebar.html' %}

            <!-- RIGHT SIDE CONTENT -->
            <div class="flex-grow-1 p-4" style="background:#f8f9fa;">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h2 class="mb-0">All Categories</h2>
                    <a href="{% url 'add_category' %}" class="btn btn-dark text-light float-right mb-2">Add New</a>
                </div>
                <table class="table">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Category Name</th>
                            <th>Created At</th>
                            <th>Updated At</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for cat in categories %}
                            <tr>
                                <th>{{ forloop.counter }}</th>
                                <td>{{ cat }}</td>
                                <td>{{ cat.created_at }}</td>
                                <td>{{ cat.updated_at }}</td>
                                <td>
                                    <a href="{% url 'edit_category' cat.id %}"><i class="fa fa-edit text-success"></i></a>
                                    &nbsp;
                                    <a href="{% url 'delete_category' cat.id %}"><i class="fa fa-trash text-danger"></i></a>
                                </td>
                            </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>

        </div>
    </div>
{% endblock %}
