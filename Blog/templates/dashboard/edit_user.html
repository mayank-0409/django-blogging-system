{% extends 'base.html' %}

{% block content %}
{% load crispy_forms_tags %}
    <div class="d-flex justify-content-center p-3 p-md-4">
        <div class="d-flex bg-white shadow-sm" style="width:100%; max-width:1400px; min-height:calc(100vh - 2rem); border-radius:1rem; overflow:hidden;">

            <!-- LOAD THE SIDE BAR -->
            {% include 'dashboard/sidebar.html' %}

            <!-- RIGHT SIDE CONTENT -->
            <div class="flex-grow-1 p-4" style="background:#f8f9fa;">
                {% if perms.auth.add_user %}
                    <h2>Edit User</h2>

                    <form action="" method="POST">
                        {% csrf_token %}
                        {{ form|crispy }}
                        <button type="submit" class="btn btn-warning">Submit</button>
                    </form>
                    <br>
                {% else %}
                    <h4>You do not have permission to view this Page</h4>
                {% endif %}
            </div>

        </div>
    </div>
{% endblock %}
