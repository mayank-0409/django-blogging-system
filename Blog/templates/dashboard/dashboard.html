{% extends 'base.html' %}

{% block content %}
    <div class="d-flex justify-content-center p-3 p-md-4">
        <div class="d-flex bg-white shadow-sm" style="width:100%; max-width:1400px; min-height:calc(100vh - 2rem); border-radius:1rem; overflow:hidden;">

            <!-- LOAD THE SIDE BAR -->
            {% include 'dashboard/sidebar.html' %}

            <!-- RIGHT SIDE CONTENT -->
            <div class="flex-grow-1 p-4 col-md-8" style="background:#f8f9fa;">

                <div class="alert alert-light border bg-white shadow-sm d-flex align-items-center">
                    <span class="mb-0">Logged in as <b class="text-primary">{{ user }}</b></span>
                </div>

                <div class="row mt-3 justify-content-center">
                    <div class="col-md-6 mb-3">
                        <div class="card border-default shadow-sm h-100">
                            <div class="card-header text-center text-uppercase font-weight-bold">
                                <i class="bi bi-collection me-1"></i>All Categories
                            </div>
                            <div class="card-body text-dark d-flex align-items-center justify-content-center">
                                <h3 class="card-title text-center mb-0">{{ category_count }}</h3>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-6 mb-3">
                        <div class="card border-default shadow-sm h-100">
                            <div class="card-header text-center text-uppercase font-weight-bold">
                                <i class="bi bi-file-text me-1"></i>All Posts
                            </div>
                            <div class="card-body text-dark d-flex align-items-center justify-content-center">
                                <h3 class="card-title text-center mb-0">{{ blogs_count }}</h3>
                            </div>
                        </div>
                    </div>
                </div>

            </div>

        </div>
    </div>
{% endblock %}
